<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Ode Works</title>
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/customer.css">
</head>
<body>

  <div id="page-loader"><div class="loader-bike"></div></div>
  <div data-include="partials/header.html"></div>

  <main>
    <section class="section" style="padding-top:140px;">
      <div class="container">
        <div class="breadcrumbs"><a href="index.html">Home</a> <i class="fa-solid fa-chevron-right" style="font-size:0.6rem;"></i> <span>Shopping Cart</span></div>
        <div class="section-head">
          <span class="eyebrow">Your Items</span>
          <h1>Shopping Cart</h1>
        </div>

        <div class="cart-layout" id="cart-layout">
          <div id="cart-items-col"></div>
          <div class="card summary-box" id="summary-box" style="display:none;">
            <h3 class="mb-3">Order Summary</h3>
            <div class="summary-row"><span>Subtotal</span><strong id="summary-subtotal">₱0</strong></div>
            <div class="summary-row"><span>Shipping</span><strong id="summary-shipping">₱0</strong></div>
            <div class="promo-row">
              <input type="text" class="form-control" id="promo-input" placeholder="Promo code">
              <button class="btn btn-secondary" id="apply-promo-btn">Apply</button>
            </div>
            <div class="summary-row" id="discount-row" style="display:none;"><span>Discount</span><strong id="summary-discount">-₱0</strong></div>
            <div class="summary-row total"><span>Total</span><strong id="summary-total">₱0</strong></div>
            <a href="checkout.html" class="btn btn-primary btn-block btn-lg mt-3" id="checkout-btn">Proceed to Checkout</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-include="partials/footer.html"></div>

  <script type="module" src="assets/js/includes.js"></script>
  <script type="module" src="assets/js/nav.js"></script>
  <script type="module" src="assets/js/pages/cart-page.js"></script>
  <script>
    window.addEventListener('load', () => document.getElementById('page-loader')?.classList.add('hidden'));
  </script>
</body>
</html>
