<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Ode Works</title>
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/customer.css">
</head>
<body>

  <div id="page-loader"><div class="loader-bike"></div></div>
  <div data-include="partials/header.html"></div>

  <main>
    <section class="section" style="padding-top:140px;">
      <div class="container">
        <div class="profile-layout">
          <aside class="card profile-sidebar">
            <img class="profile-avatar" id="profile-avatar" src="https://placehold.co/200x200/1a1a1a/fff?text=You" alt="Avatar">
            <h4 id="profile-name">Loading...</h4>
            <p class="text-muted" id="profile-email" style="font-size:0.85rem;"></p>
            <div class="profile-menu mt-3" style="text-align:left;">
              <a href="#" data-panel="account" class="active"><i class="fa-regular fa-user"></i> Account Info</a>
              <a href="#" data-panel="orders"><i class="fa-solid fa-bag-shopping"></i> Order History</a>
              <a href="#" data-panel="wishlist"><i class="fa-regular fa-heart"></i> Wishlist</a>
              <a href="#" data-panel="appointments"><i class="fa-regular fa-calendar-check"></i> Appointments</a>
              <a href="#" id="logout-btn" class="danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
          </aside>

          <div>
            <!-- ACCOUNT INFO -->
            <div class="profile-panel" data-panel-content="account">
              <div class="card glass" style="padding:28px;">
                <h3 class="mb-3">Account Information</h3>
                <form id="account-form">
                  <div class="form-row">
                    <div class="form-group"><label>Full Name</label><input type="text" class="form-control" name="full_name" required></div>
                    <div class="form-group"><label>Phone</label><input type="tel" class="form-control" name="phone"></div>
                  </div>
                  <div class="form-group"><label>Email</label><input type="email" class="form-control" name="email" disabled></div>
                  <div class="form-row">
                    <div class="form-group"><label>Address</label><input type="text" class="form-control" name="address"></div>
                    <div class="form-group"><label>City</label><input type="text" class="form-control" name="city"></div>
                  </div>
                  <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
              </div>
            </div>

            <!-- ORDERS -->
            <div class="profile-panel" data-panel-content="orders" style="display:none;">
              <h3 class="mb-3">Order History</h3>
              <div id="orders-list"></div>
            </div>

            <!-- WISHLIST -->
            <div class="profile-panel" data-panel-content="wishlist" style="display:none;">
              <h3 class="mb-3">My Wishlist</h3>
              <div class="product-grid" id="wishlist-grid"></div>
            </div>

            <!-- APPOINTMENTS -->
            <div class="profile-panel" data-panel-content="appointments" style="display:none;">
              <h3 class="mb-3">My Appointments</h3>
              <div id="appointments-list"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-include="partials/footer.html"></div>

  <script type="module" src="assets/js/includes.js"></script>
  <script type="module" src="assets/js/nav.js"></script>
  <script type="module" src="assets/js/pages/profile.js"></script>
  <script>
    window.addEventListener('load', () => document.getElementById('page-loader')?.classList.add('hidden'));
  </script>
</body>
</html>
