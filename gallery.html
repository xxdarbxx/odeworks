<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Ode Works</title>
  <meta name="description" content="Before and after motorcycle repair work by Ode Works.">
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

  <div id="page-loader"><div class="loader-bike"></div></div>
  <div data-include="partials/header.html"></div>

  <main>
    <section class="page-banner" style="background-image:url('https://images.unsplash.com/photo-1771402629441-95e637743f93?auto=format&fit=crop&w=1920&q=80');">
      <div class="container">
        <div class="breadcrumbs"><a href="index.html">Home</a> <i class="fa-solid fa-chevron-right" style="font-size:0.6rem;"></i> <span>Gallery</span></div>
        <span class="eyebrow">Our Work</span>
        <h1>Before &amp; After</h1>
        <p>A look at real repairs completed at our Galas, Quezon City shop. Hover a card (or tap on mobile) to reveal the after photo.</p>
      </div>
    </section>

    <section class="section container">
      <div class="gallery-filter-row" id="category-filter"></div>
      <div class="gallery-grid" id="gallery-grid" data-aos="fade-up"></div>
    </section>
  </main>

  <div data-include="partials/footer.html"></div>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox-overlay">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    <div class="lightbox-content">
      <h3 id="lightbox-title" class="mb-2 text-center"></h3>
      <div class="lightbox-images">
        <div><p class="text-center form-hint mb-1">BEFORE</p><img id="lightbox-before" src="" alt="Before"></div>
        <div><p class="text-center form-hint mb-1">AFTER</p><img id="lightbox-after" src="" alt="After"></div>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/includes.js"></script>
  <script type="module" src="assets/js/nav.js"></script>
  <script type="module" src="assets/js/pages/gallery.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 700, once: true, offset: 60 });
    window.addEventListener('load', () => document.getElementById('page-loader')?.classList.add('hidden'));
  </script>
</body>
</html>
