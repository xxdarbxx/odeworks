<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Ode Works</title>
  <meta name="description" content="Get in touch with Ode Works — Galas, Quezon City, Philippines.">
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

  <div id="page-loader"><div class="loader-bike"></div></div>
  <div data-include="partials/header.html"></div>

  <main>
    <section class="page-banner" style="min-height:36vh;background-image:url('https://images.unsplash.com/photo-1758887698531-15c11a7f3dbb?auto=format&fit=crop&w=1920&q=80');">
      <div class="container">
        <div class="breadcrumbs"><a href="index.html">Home</a> <i class="fa-solid fa-chevron-right" style="font-size:0.6rem;"></i> <span>Contact</span></div>
        <span class="eyebrow">Get In Touch</span>
        <h1>Contact Ode Works</h1>
      </div>
    </section>

    <section class="section container">
        <div class="contact-layout">
          <div>
            <div class="card glass" style="padding:32px;">
              <h3 class="mb-3">Send Us a Message</h3>
              <form id="contact-form">
                <div class="form-row">
                  <div class="form-group"><label>Full Name</label><input type="text" class="form-control" name="name" required></div>
                  <div class="form-group"><label>Email</label><input type="email" class="form-control" name="email" required></div>
                </div>
                <div class="form-group"><label>Subject</label><input type="text" class="form-control" name="subject" required></div>
                <div class="form-group"><label>Message</label><textarea class="form-control" name="message" rows="5" required></textarea></div>
                <button type="submit" class="btn btn-primary btn-lg btn-block">
                  <span class="btn-label">Send Message</span>
                </button>
              </form>
            </div>
          </div>

          <div>
            <img src="https://images.unsplash.com/photo-1758887698531-15c11a7f3dbb?auto=format&fit=crop&w=700&q=80" alt="Our mechanics at work in the shop" class="contact-photo">
            <div class="contact-info-item">
              <div class="icon-wrap"><i class="fa-solid fa-location-dot"></i></div>
              <div><h4>Visit Us</h4><p class="text-muted">Galas, Quezon City, Philippines</p></div>
            </div>
            <div class="contact-info-item">
              <div class="icon-wrap"><i class="fa-solid fa-phone"></i></div>
              <div><h4>Call Us</h4><p class="text-muted">+63 917 000 0000</p></div>
            </div>
            <div class="contact-info-item">
              <div class="icon-wrap"><i class="fa-solid fa-envelope"></i></div>
              <div><h4>Email Us</h4><p class="text-muted">hello@odeworks.ph</p></div>
            </div>
            <div class="contact-info-item">
              <div class="icon-wrap"><i class="fa-solid fa-clock"></i></div>
              <div><h4>Business Hours</h4><p class="text-muted">Mon-Sat 9:00 AM - 6:00 PM</p></div>
            </div>

            <div class="map-embed mt-3">
              <iframe src="https://maps.google.com/maps?q=Galas,%20Quezon%20City,%20Philippines&t=&z=15&ie=UTF8&iwloc=&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Ode Works location map"></iframe>
            </div>

            <div class="social-row mt-3">
              <a href="https://facebook.com/odeworks" target="_blank" rel="noopener" class="icon-btn"><i class="fa-brands fa-facebook-f"></i></a>
              <a href="https://instagram.com/odeworks" target="_blank" rel="noopener" class="icon-btn"><i class="fa-brands fa-instagram"></i></a>
              <a href="https://tiktok.com/@odeworks" target="_blank" rel="noopener" class="icon-btn"><i class="fa-brands fa-tiktok"></i></a>
              <a href="https://youtube.com/@odeworks" target="_blank" rel="noopener" class="icon-btn"><i class="fa-brands fa-youtube"></i></a>
            </div>
          </div>
        </div>
    </section>
  </main>

  <div data-include="partials/footer.html"></div>

  <script type="module" src="assets/js/includes.js"></script>
  <script type="module" src="assets/js/nav.js"></script>
  <script type="module" src="assets/js/pages/contact.js"></script>
  <script>
    window.addEventListener('load', () => document.getElementById('page-loader')?.classList.add('hidden'));
  </script>
</body>
</html>
