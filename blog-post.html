<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Blog Post | Ode Works</title>
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

  <div id="page-loader"><div class="loader-bike"></div></div>
  <div data-include="partials/header.html"></div>

  <main>
    <section class="page-banner" id="post-hero" style="min-height:44vh;">
      <div class="container"><span class="badge badge-accent" id="post-category"></span></div>
    </section>

    <section class="section container">
      <div class="blog-post-body">
        <div class="breadcrumbs"><a href="index.html">Home</a> <i class="fa-solid fa-chevron-right" style="font-size:0.6rem;"></i> <a href="blog.html">Blog</a> <i class="fa-solid fa-chevron-right" style="font-size:0.6rem;"></i> <span id="breadcrumb-title">Loading...</span></div>
        <h1 id="post-title"></h1>
        <div class="blog-meta mt-2 mb-3" id="post-meta"></div>
        <div id="post-content"></div>
        <div class="flex gap-1 mt-4" id="post-tags"></div>
      </div>
    </section>

    <section class="section container">
      <div class="section-head row">
        <div><span class="eyebrow">Keep Reading</span><h2>More Articles</h2></div>
      </div>
      <div class="grid grid-3" id="related-posts"></div>
    </section>
  </main>

  <div data-include="partials/footer.html"></div>

  <script type="module" src="assets/js/includes.js"></script>
  <script type="module" src="assets/js/nav.js"></script>
  <script type="module" src="assets/js/pages/blog-post.js"></script>
  <script>
    window.addEventListener('load', () => document.getElementById('page-loader')?.classList.add('hidden'));
  </script>
</body>
</html>
