<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | Ode Works Admin</title>
  <link rel="icon" href="../assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/customer.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">
  <div id="page-loader"><div class="loader-bike"></div></div>
  <div data-include="../partials/admin-sidebar.html"></div>
  <div class="admin-main">
    <div data-include="../partials/admin-topbar.html"></div>
    <div class="admin-content">
      <div class="kpi-inline" id="report-kpis"></div>

      <div class="dash-charts-grid">
        <div class="card chart-card">
          <div class="chart-head"><h3>Revenue Trend (Last 12 Months)</h3></div>
          <div class="chart-canvas-wrap"><canvas id="revenue-trend-chart"></canvas></div>
        </div>
        <div class="card chart-card">
          <div class="chart-head"><h3>Orders by Status</h3></div>
          <div class="chart-canvas-wrap"><canvas id="order-status-chart"></canvas></div>
        </div>
      </div>

      <div class="dash-bottom-grid">
        <div class="card chart-card">
          <div class="chart-head"><h3>Top Selling Motorcycles</h3></div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Model</th><th>Units Sold</th><th>Revenue</th></tr></thead>
              <tbody id="top-motos-body"><tr><td colspan="3"><div class="spinner"></div></td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="card chart-card">
          <div class="chart-head"><h3>Top Selling Products</h3></div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Product</th><th>Units Sold</th><th>Revenue</th></tr></thead>
              <tbody id="top-products-body"><tr><td colspan="3"><div class="spinner"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="../assets/js/includes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script type="module" src="../assets/js/admin/reports.js"></script>
  <script>
    window.addEventListener('load', () => document.getElementById('page-loader')?.classList.add('hidden'));
  </script>
</body>
</html>
