<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Ode Works Admin</title>
  <link rel="icon" href="../assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/customer.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">
  <div id="page-loader"><div class="loader-bike"></div></div>

  <div data-include="../partials/admin-sidebar.html"></div>

  <div class="admin-main">
    <div data-include="../partials/admin-topbar.html"></div>

    <div class="admin-content">
      <div class="dash-grid" id="stat-cards">
        <div class="skeleton skeleton-card" style="height:120px;"></div>
        <div class="skeleton skeleton-card" style="height:120px;"></div>
        <div class="skeleton skeleton-card" style="height:120px;"></div>
        <div class="skeleton skeleton-card" style="height:120px;"></div>
      </div>

      <div class="dash-charts-grid">
        <div class="card chart-card">
          <div class="chart-head"><h3>Sales Overview</h3>
            <div class="select-wrap"><select class="form-control" id="sales-range-select" style="width:auto;"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select></div>
          </div>
          <div class="chart-canvas-wrap"><canvas id="sales-chart"></canvas></div>
        </div>
        <div class="card chart-card">
          <div class="chart-head"><h3>Inventory by Category</h3></div>
          <div class="chart-canvas-wrap"><canvas id="inventory-chart"></canvas></div>
        </div>
      </div>

      <div class="dash-charts-grid">
        <div class="card chart-card">
          <div class="chart-head"><h3>Revenue by Order Status</h3></div>
          <div class="chart-canvas-wrap sm"><canvas id="revenue-chart"></canvas></div>
        </div>
        <div class="card chart-card">
          <div class="chart-head"><h3>Notifications</h3></div>
          <div id="notifications-list"></div>
        </div>
      </div>

      <div class="dash-bottom-grid">
        <div class="card chart-card">
          <div class="chart-head"><h3>Latest Orders</h3><a href="orders.html" style="font-size:0.85rem;color:var(--color-accent);">View All</a></div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead>
              <tbody id="latest-orders-body"><tr><td colspan="4"><div class="spinner"></div></td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="card chart-card">
          <div class="chart-head"><h3>Upcoming Appointments</h3><a href="appointments.html" style="font-size:0.85rem;color:var(--color-accent);">View All</a></div>
          <div id="appointments-overview"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../assets/js/includes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script type="module" src="../assets/js/admin/dashboard.js"></script>
  <script>
    window.addEventListener('load', () => document.getElementById('page-loader')?.classList.add('hidden'));
  </script>
</body>
</html>
