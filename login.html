<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login or Register | Ode Works</title>
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/customer.css">
</head>
<body>

  <div id="page-loader"><div class="loader-bike"></div></div>

  <div data-include="partials/header.html"></div>

  <main>
    <div class="auth-wrap">
      <div class="auth-box card glass-strong" data-aos="zoom-in">
        <div class="text-center mb-3">
          <img src="assets/img/logo.jpg" alt="Ode Works" style="width:52px;height:52px;border-radius:14px;margin-inline:auto;margin-bottom:14px;">
          <h2>Welcome to Ode Works</h2>
          <p class="mt-1">Sign in to manage orders, wishlist, and appointments.</p>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="register">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="form-control" name="email" placeholder="you@email.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" name="password" placeholder="••••••••" required>
          </div>
          <div class="flex-between mb-2">
            <label class="checkbox-row" style="font-size:0.85rem;"><input type="checkbox"> Remember me</label>
            <a href="#" style="font-size:0.85rem;color:var(--color-accent);">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">
            <span class="btn-label">Sign In</span>
          </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" style="display:none;">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" class="form-control" name="fullName" placeholder="Juan Dela Cruz" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="form-control" name="email" placeholder="you@email.com" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" class="form-control" name="phone" placeholder="09XX XXX XXXX">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" name="password" placeholder="At least 6 characters" minlength="6" required>
          </div>
          <label class="checkbox-row mb-2" style="font-size:0.85rem;"><input type="checkbox" required> I agree to the Terms &amp; Privacy Policy</label>
          <button type="submit" class="btn btn-primary btn-block btn-lg">
            <span class="btn-label">Create Account</span>
          </button>
        </form>

        <div class="auth-divider">or continue with</div>
        <div class="social-auth-row">
          <button class="btn btn-secondary" id="google-auth-btn"><i class="fa-brands fa-google"></i> Google</button>
          <button class="btn btn-secondary" id="facebook-auth-btn"><i class="fa-brands fa-facebook-f"></i> Facebook</button>
        </div>
      </div>
    </div>
  </main>

  <div data-include="partials/footer.html"></div>

  <script type="module" src="assets/js/includes.js"></script>
  <script type="module" src="assets/js/nav.js"></script>
  <script type="module" src="assets/js/pages/auth-page.js"></script>
  <script>
    window.addEventListener('load', () => document.getElementById('page-loader')?.classList.add('hidden'));
  </script>
</body>
</html>
