<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book an Appointment | Ode Works</title>
  <meta name="description" content="Book a motorcycle service appointment at Ode Works in Galas, Quezon City.">
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/customer.css">
</head>
<body>

  <div id="page-loader"><div class="loader-bike"></div></div>
  <div data-include="partials/header.html"></div>

  <main>
    <section class="section" style="padding-top:140px;">
      <div class="container" style="max-width:900px;">
        <div class="breadcrumbs"><a href="index.html">Home</a> <i class="fa-solid fa-chevron-right" style="font-size:0.6rem;"></i> <span>Book Appointment</span></div>
        <div class="section-head text-center" style="align-items:center;">
          <span class="eyebrow">Service Booking</span>
          <h1>Book Your Appointment</h1>
        </div>

        <div class="booking-steps">
          <div class="booking-step active" data-step="1"><div class="dot">1</div><span>Service</span></div>
          <div class="booking-step" data-step="2"><div class="dot">2</div><span>Date &amp; Time</span></div>
          <div class="booking-step" data-step="3"><div class="dot">3</div><span>Your Info</span></div>
          <div class="booking-step" data-step="4"><div class="dot">4</div><span>Confirm</span></div>
        </div>

        <!-- STEP 1: Service + Mechanic -->
        <div class="booking-panel" data-step-panel="1">
          <div class="card glass" style="padding:28px;">
            <h3 class="mb-2">Select a Service</h3>
            <div class="form-group">
              <div class="select-wrap">
                <select class="form-control" id="service-select">
                  <option value="">Choose a service...</option>
                  <option value="Periodic Maintenance">Periodic Maintenance</option>
                  <option value="Engine Overhaul">Engine Overhaul</option>
                  <option value="Electrical & ECU Tuning">Electrical &amp; ECU Tuning</option>
                  <option value="Suspension & Handling">Suspension &amp; Handling</option>
                  <option value="Tire Fitting & Balancing">Tire Fitting &amp; Balancing</option>
                  <option value="Detailing & Paint Care">Detailing &amp; Paint Care</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Motorcycle Details</label>
              <input type="text" class="form-control" id="moto-info-input" placeholder="e.g. Yamaha MT-09, 2025, Plate ABC123">
            </div>
            <h3 class="mb-2 mt-3">Preferred Mechanic (optional)</h3>
            <div class="grid grid-4" id="mechanic-select-grid"></div>
            <div class="flex" style="justify-content:flex-end;"><button class="btn btn-primary btn-lg mt-3" id="step1-next">Continue <i class="fa-solid fa-arrow-right"></i></button></div>
          </div>
        </div>

        <!-- STEP 2: Date + Time -->
        <div class="booking-panel" data-step-panel="2" style="display:none;">
          <div class="calendar-wrap glass">
            <div class="calendar-head">
              <button class="btn-icon" id="cal-prev"><i class="fa-solid fa-chevron-left"></i></button>
              <h3 id="calendar-month-label"></h3>
              <button class="btn-icon" id="cal-next"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
            <h4 class="mt-3 mb-2">Available Time Slots</h4>
            <div class="time-slots" id="time-slots"></div>
          </div>
          <div class="flex-between mt-3">
            <button class="btn btn-secondary" id="step2-back"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <button class="btn btn-primary" id="step2-next">Continue <i class="fa-solid fa-arrow-right"></i></button>
          </div>
        </div>

        <!-- STEP 3: Contact Info -->
        <div class="booking-panel" data-step-panel="3" style="display:none;">
          <div class="card glass" style="padding:28px;">
            <h3 class="mb-2">Your Information</h3>
            <div class="form-row">
              <div class="form-group"><label>Full Name</label><input type="text" class="form-control" id="contact-name" required></div>
              <div class="form-group"><label>Phone Number</label><input type="tel" class="form-control" id="contact-phone" required></div>
            </div>
            <div class="form-group"><label>Email</label><input type="email" class="form-control" id="contact-email" required></div>
            <div class="form-group"><label>Additional Notes</label><textarea class="form-control" id="contact-notes" placeholder="Any specific concerns about your motorcycle?"></textarea></div>
          </div>
          <div class="flex-between mt-3">
            <button class="btn btn-secondary" id="step3-back"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <button class="btn btn-primary" id="step3-next">Review Booking <i class="fa-solid fa-arrow-right"></i></button>
          </div>
        </div>

        <!-- STEP 4: Confirm -->
        <div class="booking-panel" data-step-panel="4" style="display:none;">
          <div class="card glass" style="padding:28px;" id="booking-summary"></div>
          <div class="flex-between mt-3">
            <button class="btn btn-secondary" id="step4-back"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <button class="btn btn-primary btn-lg" id="confirm-booking-btn">Confirm Appointment</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-include="partials/footer.html"></div>

  <script type="module" src="assets/js/includes.js"></script>
  <script type="module" src="assets/js/nav.js"></script>
  <script type="module" src="assets/js/pages/booking.js"></script>
  <script>
    window.addEventListener('load', () => document.getElementById('page-loader')?.classList.add('hidden'));
  </script>
</body>
</html>
